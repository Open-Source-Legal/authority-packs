# Multilateral regime lists — Wassenaar, MTCR, NSG, Australia Group
#
# Namespace registry + citation taxonomy for the `multilateral_regimes` base pack.
# Split out of the monolithic `itar` pack; prefixes and rows are unchanged.
#
# Aliases are LOWERCASED surface strings and drive Tier-1 extraction
# ("Section N of the <alias>" / "<alias> Section N"). Citation SHAPES are not
# declarable here — they are compiled into the extractor — so a row whose
# `from_key` uses a shape prefix (`act:`, `cfr-22:`) is the taxonomy catching
# what the shape grammar emitted and folding it onto a real key.
#
# `rewrite_rules` is deliberately empty and stays that way: a pack's rewrite
# rules are never loaded, only its equivalences are, so every mapping has to be
# an explicit {from_key, to_key} row.

prefixes:
  wa:
    display_name: Wassenaar Arrangement Dual-Use List and Munitions List
    jurisdiction: us
    authority_type: treaty
    aliases:
    - wassenaar
    - wassenaar arrangement
  mtcr:
    display_name: Missile Technology Control Regime Annex
    jurisdiction: us
    authority_type: treaty
    aliases:
    - mtcr
    - missile technology control regime
  nsg:
    display_name: Nuclear Suppliers Group Guidelines (INFCIRC/254)
    jurisdiction: us
    authority_type: treaty
    aliases:
    - nuclear suppliers group
    - nsg
    - infcirc/254
    - trigger list
  ag:
    display_name: Australia Group Common Control Lists
    jurisdiction: us
    authority_type: treaty
    aliases:
    - australia group

equivalences: []

rewrite_rules: []
shape_rules:
- pattern: ^usml$
  jurisdiction: us
  authority_type: regulation
- pattern: ^ddtc$
  jurisdiction: us
  authority_type: guidance
