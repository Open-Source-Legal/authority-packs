schema_version: 2
name: multilateral_regimes
display_name: Multilateral regime lists — Wassenaar, MTCR, NSG, Australia Group
description: 'The lists the USML and the CCL implement. A ''600 series'' ECCN exists because Wassenaar
  agreed a control; MTCR Item 1 is why a 300 km / 500 kg UAV is treated as it is. Without these a pack
  can say what the US controls and never why — and cannot answer whether a control is multilateral or
  US-unique, which is the question that decides how an allied transfer is argued.


  Four prefixes on ONE corpus, so `wa:ml1` and `mtcr:item-1` stay addressable as themselves without four
  corpora against the platform''s group cap. Nothing here is binding law; every section says so.'
