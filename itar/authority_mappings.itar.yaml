  # --- RESERVED --------------------------------------------------------------
  # Declared but not bound to any corpus in this pack, so a later EAR/OFAC pack
  # can claim them additively. A prefix binds to exactly ONE corpus and the
  # installer refuses to move it, so reserving beats renaming later.
  #
  # BEFORE UNCOMMENTING, dump the target install's existing prefixes --
  # `AuthorityNamespace.objects.values_list('prefix', flat=True)` -- and check
  # for collisions. Precedent: `irc` is already bound globally to the INTERNAL
  # REVENUE CODE. `ear` is exactly that kind of short, ambiguous word.
  #
  # ecra:     50 U.S.C. 4801-4852 (Export Control Reform Act of 2018)
  # ieepa:    50 U.S.C. 1701-1706
  # ofac:     31 C.F.R. Chapter V / SDN List

# ---------------------------------------------------------------------------
# equivalences: from_key -> to_key. Explicit rows are the ONLY mapping
# mechanism a pack can contribute (see rewrite_rules note below).
# ---------------------------------------------------------------------------
equivalences:
  # --- HAND-MAINTAINED -------------------------------------------------------
  # Rows here are preserved by `build/gen_equivalences.py --write`, which only
  # rewrites the GENERATED block below. This is where forms OBSERVED ON A LIVE
  # CORPUS belong: after ingesting documents, read
  # `CorpusReference.objects.values_list("canonical_key", flat=True)` and add
  # what actually appeared. Observed forms beat guessed ones every time -- the
  # fort_worth build's decisive fix was a slug no amount of a priori reasoning
  # produced.
  - { from_key: "act:title-22-part-121", to_key: "itar:121" }
  # OBSERVED on a live corpus, 2026-08-13: "Supplement No. 4 to Part 774 of the
  # EAR" extracts as `ear:774`, because the alias that matched is the EAR's.
  # But Part 774 IS the Commerce Control List and lives in the `ccl` corpus, so
  # there is no `ear:774` document and the reference resolved EXTERNAL. This is
  # the cross-corpus seam that splitting `ccl` out of `ear` creates, and it is
  # exactly the kind of row this hand-maintained block exists for — no amount
  # of a priori reasoning produced it; one query against CorpusReference did.
  - { from_key: "ear:774", to_key: "ccl:supplement-1-part-774", note: "Part 774 is the CCL" }
  # "Section 2778(h)" slugifies with the subsection folded in and dots dashed.
  - { from_key: "act:section-2778-h-of-the-arms-export-control-act", to_key: "aeca:2778" }

