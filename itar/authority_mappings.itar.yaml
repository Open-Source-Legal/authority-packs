# ITAR and the United States Munitions List (22 C.F.R. 120-130)
#
# Namespace registry + citation taxonomy for the `itar` base pack.
# Split out of the monolithic `itar` pack; prefixes and rows are unchanged.
#
# Aliases are LOWERCASED surface strings and drive Tier-1 extraction
# ("Section N of the <alias>" / "<alias> Section N"). Citation SHAPES are not
# declarable here — they are compiled into the extractor — so a row whose
# `from_key` uses a shape prefix (`act:`, `cfr-22:`) is the taxonomy catching
# what the shape grammar emitted and folding it onto a real key.
#
# `rewrite_rules` is deliberately empty and stays that way: a pack's rewrite
# rules are never loaded, only its equivalences are, so every mapping has to be
# an explicit {from_key, to_key} row.

prefixes:
  itar:
    display_name: International Traffic in Arms Regulations
    jurisdiction: us
    authority_type: regulation
    aliases:
    - international traffic in arms regulations
    - itar
    - 22 c.f.r.
    - 22 cfr
    - title 22 of the code of federal regulations
  usml:
    display_name: United States Munitions List
    jurisdiction: us
    authority_type: regulation
    aliases:
    - united states munitions list
    - u.s. munitions list
    - us munitions list
    - usml
    - munitions list

