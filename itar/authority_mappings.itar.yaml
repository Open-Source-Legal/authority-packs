# ITAR pack — namespace registry + citation taxonomy.
#
# Same schema as opencontractserver/enrichment/data/authority_mappings.yaml plus
# the pack-only `abbreviations` extension. Loaded idempotently by
# `manage.py load_authority_pack`.
#
# Aliases are LOWERCASED surface strings and drive Tier-1 extraction
# ("Section N of the <alias>" / "<alias> Section N"). Anything the regexes
# cannot reach -- chapter-style and prose citations -- is caught by the LLM tier
# and folded onto canonical keys by `equivalences` below.

