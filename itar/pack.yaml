# ITAR and the United States Munitions List (22 C.F.R. 120-130) — schema v2 manifest.
#
# An ATOMIC base pack: one publisher, one update cadence, one provenance story,
# one approval status. Composed into a working assembly by a domain pack, which
# supplies the corpus group, the orchestrator and the cross-pack equivalences —
# none of which belong to any single body of law.
#
# HARVESTED, NOT LEGALLY REVIEWED. Every section body is verbatim text from the
# official source — no stubs, no paraphrase — but no attorney has reviewed it,
# which is what `approval_status: harvested_unreviewed` in each charter records.
#
# `source_hosts` is unioned into the SSRF allowlist at runtime, so it lists the
# hosts THIS pack's content was harvested from and no others.
schema_version: 2
name: itar
display_name: ITAR and the United States Munitions List (22 C.F.R. 120-130)
description: 'The regulations implementing the AECA, and the USML they turn on. The USML is a separate
  CORPUS so that `usml:viii` is addressable as itself, but it is not a separate PACK: 22 C.F.R. § 121.1
  comes from the same eCFR harvest on the same version date as the rest of Parts 120-130.'
jurisdiction: us
mappings: authority_mappings.itar.yaml
source_hosts:
- www.ecfr.gov
corpora:
- slug: itar-regulations
  title: International Traffic in Arms Regulations (22 C.F.R. Parts 120-130)
  authority_prefixes:
  - itar
  description: 'The regulations implementing the AECA: definitions and policy (Part 120), the USML itself
    (Part 121), registration (122), licensing of defense articles (123), agreements and defense services
    (124), technical data (125), general policies and country policy (126), violations and penalties (127),
    administrative procedures (128), brokering (129), and political contributions/fees (130).

    '
  charter: charters/itar-regulations.yaml
  spec: specs/itar-regulations.json
  persona: personas/itar-regulations.txt
  default_authority_weight: IMPLEMENTING
- slug: usml
  title: United States Munitions List (22 C.F.R. § 121.1, Categories I-XXI)
  authority_prefixes:
  - usml
  description: 'The 21 USML categories that define what is a defense article. Keyed by lowercase Roman
    numeral (usml:viii, usml:xi) because authority-key matching is case-sensitive on the section part
    and the citation extractor lowercases what it finds.

    '
  charter: charters/usml.yaml
  spec: specs/usml.json
  persona: personas/usml.txt
  default_authority_weight: IMPLEMENTING
