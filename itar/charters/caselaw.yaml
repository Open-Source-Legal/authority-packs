title: "Federal court decisions construing the AECA, the ITAR and the EAR"
slug: "caselaw"
purpose: >
  Carry the judicial gloss. The seed document advises on penalty exposure, and exposure turns on the willfulness standard — which is a holding, not a regulation. Advising on it without the cases is a substantive defect.
include:
  - "5 sections, verbatim, harvested from the official source"
exclude:
  - "anything outside the parts named in the title"
authority_tiers:
  default: "INTERPRETIVE"
notes: >
  Added under the authority-layer expansion manifest, 2026-08-13.
  Every section carries the manifest's schema fields: authority_tier,
  regime, effective_date, status, binding, superseded_by and
  fr_citation. `binding` is FALSE for every guidance, preamble,
  enforcement and advisory corpus — those are evidence of what the
  agency does or thinks, never the rule itself.
  For case law `binding` is neither a constant nor a synonym for
  `still_good_law`: it is derived from the COURT, because that is what
  precedential force turns on. An appellate holding binds within its
  circuit; a district opinion binds nobody however sound its reasoning.
  An unrecognised court name resolves to FALSE on purpose —
  understating an opinion is the safer error.
update_expectation: "continuous"
current_as_of: "2026-08-13 (see the section metadata for the per-source capture date)"
approval_status: "harvested_unreviewed"
legal_owner: null
technical_owner: null
