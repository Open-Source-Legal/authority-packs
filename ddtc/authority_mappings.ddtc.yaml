# DDTC published practice — guidance, enforcement, CJ and advisory opinions
#
# Namespace registry + citation taxonomy for the `ddtc` base pack.
# Split out of the monolithic `itar` pack; prefixes and rows are unchanged.
#
# Aliases are LOWERCASED surface strings and drive Tier-1 extraction
# ("Section N of the <alias>" / "<alias> Section N"). Citation SHAPES are not
# declarable here — they are compiled into the extractor — so a row whose
# `from_key` uses a shape prefix (`act:`, `cfr-22:`) is the taxonomy catching
# what the shape grammar emitted and folding it onto a real key.
#
# `rewrite_rules` is deliberately empty and stays that way: a pack's rewrite
# rules are never loaded, only its equivalences are, so every mapping has to be
# an explicit {from_key, to_key} row.

prefixes:
  ddtc:
    display_name: Directorate of Defense Trade Controls guidance
    jurisdiction: us
    authority_type: guidance
    aliases:
    - directorate of defense trade controls
    - ddtc
    - ddtc guidance
  ddtc-enf:
    display_name: DDTC enforcement actions and consent agreements
    jurisdiction: us
    authority_type: guidance
    aliases:
    - consent agreement
    - charging letter
  cj:
    display_name: Commodity jurisdiction determinations
    jurisdiction: us
    authority_type: guidance
    aliases:
    - commodity jurisdiction determination
    - ds-4076
  ao:
    display_name: DDTC advisory opinions
    jurisdiction: us
    authority_type: guidance
    aliases:
    - advisory opinion
  redline:
    display_name: DDTC published ITAR guidance
    jurisdiction: us
    authority_type: guidance
    aliases:
    - ddtc guidance

equivalences:
- from_key: ddtc:cj
  to_key: ddtc:commodity-jurisdiction
- from_key: act:commodity-jurisdiction
  to_key: ddtc:commodity-jurisdiction
- from_key: ddtc:faq
  to_key: ddtc:faq-index

rewrite_rules: []
shape_rules:
- pattern: ^usml$
  jurisdiction: us
  authority_type: regulation
- pattern: ^ddtc$
  jurisdiction: us
  authority_type: guidance
