title: "DDTC advisory opinions"
slug: "ao"
purpose: >
  Carry the advisory-opinion layer, applicant-specific and non-binding by its own terms.
include:
  - "1 sections, verbatim, harvested from the official source"
exclude:
  - "anything outside the parts named in the title"
authority_tiers:
  default: "INTERPRETIVE"
notes: >
  Added under the authority-layer expansion manifest, 2026-08-13.
  Every section carries the manifest's schema fields: authority_tier,
  regime, effective_date, status, binding, superseded_by and
  fr_citation. `binding` is FALSE for every guidance, preamble,
  enforcement and advisory corpus — those are evidence of what the
  agency does or thinks, never the rule itself.
update_expectation: "continuous"
current_as_of: "2026-08-13 (see the section metadata for the per-source capture date)"
approval_status: "harvested_unreviewed"
legal_owner: null
technical_owner: null
