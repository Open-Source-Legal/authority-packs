schema_version: 1
name: us-export-control
title: US export control
description: >
  Composes the bodies of law a US export-control question actually collides
  with, and states how they interact. The question this domain exists to answer
  correctly is not "what does the ITAR say" — it is "which regime governs this
  transfer, and what else must clear before it can proceed".

# Fourteen atomic base packs, each one publisher on one cadence. The ordering
# below is the order the regimes apply in, which is also the order the
# orchestrator reasons in: jurisdiction first, then authorisation, then the
# clearances that an authorisation does not grant.
requires:
  - pack: aeca
    reason: >
      The statute. Everything else on the munitions side is delegated authority,
      and the delegation has limits that only the statute states — § 2778(h) on
      the reviewability of designations is the usual one, and it is invisible
      from the regulations.

  - pack: itar
    reason: >
      The regulations and the USML. The centre of the domain: whether an item is
      a defense article is the first question, and it decides which of the two
      lists and which of the two agencies the rest of the analysis belongs to.

  - pack: ddtc
    reason: >
      What the agency says and does, as distinct from what the regulation
      provides — FAQs, commodity-jurisdiction practice, advisory opinions,
      consent agreements. Practitioners treat this as working law, so an answer
      that ignores it is wrong in practice while being right on the text. It is
      carried below IMPLEMENTING weight precisely so the model can use it
      without mistaking it for the rule.

  - pack: ear
    reason: >
      The other half of the system, and the one an ITAR answer is most often
      wrong about. The ITAR/EAR boundary is the single most consequential error
      in this field, and it cannot be reasoned about from one side: de minimis,
      the deemed-export most-recent-country rule and the "specially designed"
      carve-outs are all defined in the text this pack holds. Measured directly
      — with this pack absent, boundary questions scored identically whether
      retrieval was on or off, because the corpus held only one side.

  - pack: ofac
    reason: >
      A licence is not a clearance. An export can be ITAR-authorised and still
      prohibited because of who is on the other end, and ITAR § 126.1 is not
      coextensive with the sanctions programmes. Rules only — the restricted-
      party rosters are deliberately not carried, because screening is a lookup
      against current data and a frozen roster is worse than none.

  - pack: cfius
    reason: >
      The inbound-investment consequence of an export classification. "Critical
      technology" keys directly off USML and ECCN status, so a jurisdiction
      answer can create a mandatory declaration the client did not ask about.
      Also the reason this domain needs cross-pack equivalences at all: CFIUS
      shares CFR title 31 with OFAC.

  - pack: ecra
    reason: >
      The EAR's statutory authority, and the emergency-powers chain it ran on
      before 2018. The peer of the AECA pack: it is what makes an EAR control
      traceable to something Congress passed.

  - pack: export_fedreg
    reason: >
      Rule preambles and the delegating executive orders. The preamble is where
      the agency answers comments and says what a term means, and it is the best
      interpretive source in this field — it exists nowhere in the codified
      text. The executive orders supply the delegation chain that makes the ITAR
      an exercise of the President's authority rather than the State
      Department's own.

  - pack: export_caselaw
    reason: >
      Penalty exposure turns on the willfulness standard, which is a holding
      rather than a regulation. Advising on exposure without the cases is a
      substantive defect, not a thoroughness gap.

  - pack: multilateral_regimes
    reason: >
      Why a control exists, and whether it is multilateral or US-unique — the
      question that decides how a transfer to an ally is argued. A '600 series'
      ECCN exists because Wassenaar agreed a control; without these lists the
      domain can say what the US controls and never why.

  - pack: doj_data_security
    reason: >
      Foreign-person access to bulk sensitive data. Overlaps ITAR technical-data
      reasoning closely enough to be mistaken for it, and is a different test
      with a different trigger — which is exactly why it has to be quotable
      rather than remembered.

  - pack: nuclear_exports
    reason: >
      Mostly a routing fact, and an expensive one to get wrong: DOE Part 810
      covers ASSISTANCE — unclassified nuclear technology and services — which
      reads like an ITAR defense service and is not one.

  - pack: nispom
    reason: >
      The classified side that USML Category XVII and classified technical data
      run into. A facility clearance is not an export authorisation, and
      clearing one regime does not clear the other.

  - pack: dfars
    reason: >
      How most suppliers actually encounter export control: as a contract clause
      that flowed down to them. DFARS 252.225-7048 obliges compliance regardless
      of what the contract otherwise says, and a supplier questionnaire is
      usually that clause in disguise.

corpus_group:
  slug: us-export-control
  title: US export control — all regimes
  # Excluded because the consuming document corpus cites these heavily, so
  # citation edges already resolve into them; the exclusion buys headroom under
  # the platform's group-size cap. Excluding a corpus is a claim that it is
  # reachable WITHOUT the group — if that stops being true, remove the entry.
  #
  # The split did not change this. Corpus count is a property of the corpora,
  # not of how they are packaged: the same 21 authority corpora arrive whether
  # they come from one pack or fourteen.
  exclude_corpora:
    - aeca
    - itar-regulations
    - usml

orchestrator:
  instructions_file: orchestrator.txt
  tools:
    - search_across_corpora

# The orchestrator above is GLOBAL: it knows how these regimes interact, but
# nothing about anyone's documents. The agent that answers a real question is
# the one scoped to the corpus those documents live in, and it needs both —
# the corpus's own persona AND the reach to call across this group.
#
# Measured on the project's gold set, the difference is not marginal. The
# orchestrator-only shape grounded 6/15 questions with retrieval contributing
# sections on 7/15; the corpus agent carrying persona + this increment reached
# 13/15 and 14/15. An install without this block is the former.
#
# This pack supplies only the text, because the group slug the text must name
# is this pack's own invention. The binding — WHICH corpus — comes from
# `install_domain_pack --consumer-corpus <pk>`, because no pack can know which
# corpus will consume it. mode: EXTEND is required by the contract (C8) and is
# the point: it APPENDS to the consuming corpus's persona rather than
# replacing it, so this pack never overwrites text it does not own.
consumer_agent:
  instructions_file: consumer_agent.txt
  mode: EXTEND
  tools:
    - search_across_corpora

# --- BEGIN GENERATED EQUIVALENCES (build/split_pack.py) ---
# Title 31 is shared: OFAC's sanctions programmes and the CFIUS regulations at
# Parts 800/802. A namespace alias maps a whole CFR TITLE to one prefix, so
# "31 C.F.R. § 800.215" extracts as `ofac:800.215` — a key that does not exist
# and resolves to nothing.
#
# These rows live here rather than in either base pack because they exist only
# because both are installed together. Neither pack can carry them: `ofac`
# would be asserting keys it does not own, and `cfius` would be mapping from a
# prefix it does not declare.
#
# Generated rather than hand-written, and generated for EVERY section of the
# borrowing corpus rather than the ones some document happens to cite — so the
# next document to cite Part 800 works without anyone remembering this.
equivalences:
  - from_key: "ofac:800"
    to_key: "cfius:800"
    note: "ofac and cfius share a CFR title; the title alias binds it to ofac, so a cfius citation extracts under ofac"
  - from_key: "ofac:800.101"
