# Structured metadata columns for the bills corpus (Fieldset/Column rows at
# install). Field names match the per-section metadata the harvester stamps.
version: 1
fields:
- name: congress
  data_type: INTEGER
- name: bill_number
  data_type: INTEGER
- name: bill_version
  data_type: STRING
- name: sponsor
  data_type: STRING
- name: introduced_date
  data_type: DATE
- name: latest_action
  data_type: TEXT
- name: latest_action_date
  data_type: DATE
- name: stage
  data_type: CHOICE
  validation_config:
    choices: [introduced, committee, passed-house, passed-senate, to-president, became-law]
- name: committees
  data_type: JSON
- name: policy_area
  data_type: STRING
- name: cosponsor_count
  data_type: INTEGER
- name: short_title
  data_type: STRING
- name: current_as_of
  data_type: DATE
