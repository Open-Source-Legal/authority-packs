  state:
    "Texas Local Government Code":
      prefix: "tx-local-gov"
      jurisdiction: "us-tx"
      authority_type: "statute"
      requires_section_marker: true
    "Tex. Local Government Code":
      prefix: "tx-local-gov"
      jurisdiction: "us-tx"
      authority_type: "statute"
      requires_section_marker: true
    "Texas Government Code":
      prefix: "tx-gov"
      jurisdiction: "us-tx"
      authority_type: "statute"
      requires_section_marker: true
    "Tex. Gov't Code":
      prefix: "tx-gov"
      jurisdiction: "us-tx"
      authority_type: "statute"
      requires_section_marker: true
    "Texas Occupations Code":
      prefix: "tx-occ"
      jurisdiction: "us-tx"
      authority_type: "statute"
