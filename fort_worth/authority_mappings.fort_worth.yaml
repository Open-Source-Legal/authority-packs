# Fort Worth, Texas authority pack — namespace registry + citation taxonomy.
#
# Same schema as opencontractserver/enrichment/data/authority_mappings.yaml,
# plus the pack-only extensions (abbreviations). Loaded idempotently by
# `manage.py load_authority_pack`. Aliases are lowercased surface strings and
# drive Tier-1 citation extraction ("Section N of the <alias>" / "<alias>
# Section N"). Chapter-style citations ("Chapter 252 of the Local Government
# Code") are caught by the LLM tier and folded onto canonical keys via the
# equivalences below.
prefixes:
  muni-fort-worth:
    display_name: "Fort Worth Code of Ordinances"
    jurisdiction: "us-tx-fort-worth"
    authority_type: "municipal-ordinance"
    aliases:
      - "fort worth code of ordinances"
      - "fort worth city code"
      - "city code of the city of fort worth"
      - "code of the city of fort worth"
      - "city code"
  fw-charter:
    display_name: "Charter of the City of Fort Worth"
    jurisdiction: "us-tx-fort-worth"
    authority_type: "constitution"
    aliases:
      - "fort worth city charter"
      - "charter of the city of fort worth"
      - "city charter"
  tx-local-gov:
    display_name: "Texas Local Government Code"
    jurisdiction: "us-tx"
    authority_type: "statute"
    aliases:
      - "texas local government code"
      - "local government code"
      - "tex. local gov't code"
      - "texas local gov't code"
  tx-gov:
    display_name: "Texas Government Code"
    jurisdiction: "us-tx"
    authority_type: "statute"
    aliases:
      - "texas government code"
      - "government code"
      - "tex. gov't code"
  tx-admin-code:
    display_name: "Texas Administrative Code"
    jurisdiction: "us-tx"
    authority_type: "regulation"
    aliases:
      - "texas administrative code"
  # --- Residential construction / homeowner permitting -------------------
  # NOTE: the International Residential Code deliberately does NOT use the
  # prefix `irc` — that prefix is already bound, globally, to the Internal
  # Revenue Code. Nor is bare "irc" registered as an alias here, for the same
  # collision reason.
  fw-admin-code:
    display_name: "Fort Worth Building Administrative Code"
    jurisdiction: "us-tx-fort-worth"
    authority_type: "municipal-ordinance"
    aliases:
      - "fort worth building administrative code"
      - "building administrative code"
      - "fw building administrative code"
  fw-res-code:
    display_name: "Fort Worth Residential Code (2021 IRC as locally amended)"
    jurisdiction: "us-tx-fort-worth"
    authority_type: "municipal-ordinance"
    aliases:
      - "fort worth residential code"
      - "international residential code"
      - "2021 international residential code"
      - "residential code"
  fw-zoning:
    display_name: "Fort Worth Zoning Ordinance"
    jurisdiction: "us-tx-fort-worth"
    authority_type: "municipal-ordinance"
    aliases:
      - "fort worth zoning ordinance"
      - "zoning ordinance"
      - "fort worth zoning regulations"
  tx-occ:
    display_name: "Texas Occupations Code"
    jurisdiction: "us-tx"
    authority_type: "statute"
    aliases:
      - "texas occupations code"
      - "occupations code"
      - "tex. occ. code"
      - "tex. occupations code"
  tx-prop:
    display_name: "Texas Property Code"
    jurisdiction: "us-tx"
    authority_type: "statute"
    aliases:
      - "texas property code"
      - "property code"
      - "tex. prop. code"

# act:<slug> keys are what the LLM tier derives from verbatim chapter-style
# citations; fold the predictable spellings onto canonical chapter keys.
equivalences:
  - { from_key: "tx-gov:2270", to_key: "tx-gov:2271", note: "Ch. 2270 renumbered to 2271 (86th Leg.)" }
  - { from_key: "act:chapter-252-of-the-texas-local-government-code", to_key: "tx-local-gov:252" }
  - { from_key: "act:chapter-252-of-the-local-government-code", to_key: "tx-local-gov:252" }
  - { from_key: "act:texas-local-government-code-chapter-252", to_key: "tx-local-gov:252" }
  - { from_key: "act:texas-government-code-chapter-252", to_key: "tx-local-gov:252" }
  - { from_key: "act:chapter-271-of-the-texas-local-government-code", to_key: "tx-local-gov:271" }
  - { from_key: "act:chapter-176-of-the-local-government-code", to_key: "tx-local-gov:176" }
  - { from_key: "act:chapter-176-local-government-code", to_key: "tx-local-gov:176" }
  - { from_key: "act:chapter-2270-of-the-texas-government-code", to_key: "tx-gov:2271" }
  - { from_key: "act:chapter-2271-of-the-texas-government-code", to_key: "tx-gov:2271" }
  - { from_key: "act:chapter-2274-of-the-texas-government-code", to_key: "tx-gov:2274" }
  - { from_key: "act:chapter-2276-of-the-texas-government-code", to_key: "tx-gov:2276" }
  - { from_key: "act:chapter-2274-of-the-government-code", to_key: "tx-gov:2274" }
  - { from_key: "act:chapter-2276-of-the-government-code", to_key: "tx-gov:2276" }
  - { from_key: "act:chapter-2271-of-the-government-code", to_key: "tx-gov:2271" }
  - { from_key: "muni-fort-worth:ord-25165-10-2021", to_key: "muni-fort-worth:20-367", note: "Business Equity Ordinance codified at Ch. 20 Art. X" }
  - { from_key: "muni-fort-worth:ord-20020-12-2011", to_key: "muni-fort-worth:20-367", note: "Predecessor Business Diversity ordinance" }
  # Observed LLM-derived slug variants from the discover sample (2026-08-09),
  # incl. OCR-noise spellings that recur across the shared contract template.
  - { from_key: "act:chapter-2252-of-the-texas-government-code", to_key: "tx-gov:2252" }
  - { from_key: "act:tex-govf-code-ch-2271", to_key: "tx-gov:2271" }
  - { from_key: "act:tex-gov-r-code-ch-2276", to_key: "tx-gov:2276" }
  - { from_key: "act:tex-gov-r-code-ch-2274", to_key: "tx-gov:2274" }
  - { from_key: "act:chapter-252-local-government-code", to_key: "tx-local-gov:252" }
  - { from_key: "act:chapter-176-of-the-texas-local-government-code", to_key: "tx-local-gov:176" }
  - { from_key: "act:chapter-271-of-the-local-government-code", to_key: "tx-local-gov:271" }
  # Residential construction / homeowner permitting. Permit guides cite in
  # chapter form ("Chapter 1301 of the Occupations Code"), which only the LLM
  # tier catches; these fold the predictable slugs onto canonical keys.
  - { from_key: "act:chapter-1301-of-the-texas-occupations-code", to_key: "tx-occ:1301" }
  - { from_key: "act:chapter-1301-of-the-occupations-code", to_key: "tx-occ:1301" }
  - { from_key: "act:chapter-1302-of-the-texas-occupations-code", to_key: "tx-occ:1302" }
  - { from_key: "act:chapter-1305-of-the-texas-occupations-code", to_key: "tx-occ:1305" }
  - { from_key: "act:chapter-1305-of-the-occupations-code", to_key: "tx-occ:1305" }
  - { from_key: "act:texas-plumbing-license-law", to_key: "tx-occ:1301" }
  - { from_key: "act:chapter-202-of-the-texas-property-code", to_key: "tx-prop:202" }
  - { from_key: "act:chapter-202-of-the-property-code", to_key: "tx-prop:202" }
  - { from_key: "act:chapter-209-of-the-texas-property-code", to_key: "tx-prop:209" }
  - { from_key: "act:texas-residential-property-owners-protection-act", to_key: "tx-prop:209" }
  - { from_key: "act:chapter-7-of-the-fort-worth-city-code", to_key: "muni-fort-worth:7-1" }
  - { from_key: "act:fort-worth-building-administrative-code", to_key: "fw-admin-code:101" }

  # --- International Residential Code citations -------------------------
  # The extractor derives the prefix from the abbreviation printed in the
  # document, so "IRC R311" becomes `irc:r311` -- and `irc` is bound
  # GLOBALLY to the INTERNAL REVENUE CODE. Without these rows every Fort
  # Worth residential building-code citation lands in federal tax law.
  # Only alphanumeric section IDs are mapped; genuine tax citations are
  # purely numeric (irc:501(c)(3)) and are never touched.
  - { from_key: "irc:r202", to_key: "fw-res-code:r202" }
  - { from_key: "irc:r301.2(1)", to_key: "fw-res-code:r301.2(1)" }
