    "Tex. Occ. Code":
      prefix: "tx-occ"
      jurisdiction: "us-tx"
      authority_type: "statute"
      requires_section_marker: true
    "Texas Property Code":
      prefix: "tx-prop"
      jurisdiction: "us-tx"
      authority_type: "statute"
      requires_section_marker: true
    "Tex. Prop. Code":
      prefix: "tx-prop"
      jurisdiction: "us-tx"
      authority_type: "statute"
      requires_section_marker: true
  municipal:
    "Fort Worth Building Administrative Code":
      prefix: "fw-admin-code"
      jurisdiction: "us-tx-fort-worth"
      authority_type: "municipal-ordinance"
      requires_section_marker: true
    "Fort Worth Residential Code":
      prefix: "fw-res-code"
      jurisdiction: "us-tx-fort-worth"
      authority_type: "municipal-ordinance"
      requires_section_marker: true
    "Fort Worth Zoning Ordinance":
      prefix: "fw-zoning"
      jurisdiction: "us-tx-fort-worth"
      authority_type: "municipal-ordinance"
      requires_section_marker: true
    "Fort Worth City Code":
      prefix: "muni-fort-worth"
      jurisdiction: "us-tx-fort-worth"
      authority_type: "municipal-ordinance"
