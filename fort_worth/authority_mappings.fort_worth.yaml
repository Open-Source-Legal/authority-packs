# NOTE: `rewrite_rules` are deliberately empty. A pack's rewrite rules are NOT
# loaded — authority_mapping_loader.py reads a pack's `equivalences` only, and
# rewrite rules remain a core-shipped mechanism. The `irc:` -> `fw-res-code:`
# problem below is therefore solved with explicit equivalences, which a pack
# CAN contribute.
rewrite_rules: []

shape_rules:
  - pattern: '^fw-charter$'
    jurisdiction: "us-tx-fort-worth"
    authority_type: "constitution"

abbreviations:
  state:
    "Texas Local Government Code":
      prefix: "tx-local-gov"
